name: Verify RAPICLINICS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rapiclinics
          POSTGRES_PASSWORD: ci-isolated-test-password
          POSTGRES_DB: rapiclinics_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U rapiclinics -d rapiclinics_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - run: ruff check .
      - run: alembic upgrade head
      - name: Migrate clean PostgreSQL database
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://rapiclinics:ci-isolated-test-password@localhost:5432/rapiclinics_test
      - run: pytest -q
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo install --check
      - run: npx expo export --platform all
