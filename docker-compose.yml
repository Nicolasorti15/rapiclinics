services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rapiclinics
      POSTGRES_USER: rapiclinics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U rapiclinics]
      interval: 5s
      retries: 15
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: /bin/sh
    command: ['-c', 'until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done; mc mb --ignore-existing local/rapiclinics']
  api:
    build: ./services/api
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://rapiclinics:${POSTGRES_PASSWORD}@postgres:5432/rapiclinics
      APP_MODE: demo
      APP_ENV: development
      DEMO_PASSWORD: ${DEMO_PASSWORD:-RapiDemo2026!}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
    ports:
      - '8000:8000'
    volumes:
      - api-data:/app/data
volumes:
  postgres-data:
  minio-data:
  api-data:
